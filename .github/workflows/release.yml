name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Tag must match __version__
        shell: pwsh
        run: |
          $version = python -c "import livetranslate; print(livetranslate.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match v$version" }
      - run: python scripts/build.py
      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/LiveTranslate.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LiveTranslate.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LiveTranslate.exe
            dist/SHA256SUMS.txt
